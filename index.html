<script>const questions=[{"id": 1, "stem": "Na Crítica da Razão Pura, Kant discute sobre a distinção de todos os objetos enquanto fenômenos e númenos: Chamam-se fenômenos as manifestações sensíveis na medida em que são pensadas como objetos, segundo a unidade das categorias. Mas, se admitirmos coisas que sejam meros objetos do entendimento e, não obstante, como tais, possam ser dadas a uma intuição, embora não intuição sensível, teremos de as designar por númenos. KANT, I. Crítica da Razão Pura. 3. ed. Lisboa: Fundação Calouste Gulbenkian, 1994, p. 265 (A249). Com base na distinção entre fenômenos e númenos e nos conhecimentos sobre a filosofia de Kant, assinale a alternativa correta.", "options": ["Podemos conhecer os objetos para além dos limites da experiência possível.", "Podemos conhecer e chamar de fenômenos os objetos enquanto realidade em si mesma.", "Podemos conhecer os númenos na medida em que podem ser pensados.", "Podemos pensar e conhecer um fenômeno enquanto objeto da intuição sensível.", "Podemos chamar de númeno tudo que possa ser pensado e conhecido."], "subject": "Filosofia", "answer": "D", "image": false}, {"id": 2, "stem": "Observe a imagem a seguir. Elvis Presley, Andy Warhol Considerado um dos artistas contemporâneos mais influentes, Andy Warhol marcou o cenário artístico e cultural de sua época. Em relação à obra e às características do movimento artístico a que o Andy Warhol pertenceu, assinale a alternativa correta.", "options": ["Questionam os fundamentos da sociedade de consumo, fazendo uma crítica aos seus valores culturais de forma irônica.", "Rejeitam os valores estéticos tradicionais, a razão e a lógica e buscam a espontaneidade e o absurdo na arte.", "Valorizam a experimentação com diferentes linguagens, materiais e técnicas e adotam novas formas de expressão artística.", "Utilizam materiais simples e naturais para empobrecer a obra de arte, eliminando a barreira entre Arte e cotidiano.", "Centradas no conceito e reflexões sobre a Arte considerados mais relevantes que a obra, desmaterializam e reduzem a obra ao mínimo."], "subject": "Artes", "answer": "A", "image": true}, {"id": 3, "stem": "Leia o texto a seguir. Sob o poder do monopólio, toda cultura de massas é idêntica, e seu esqueleto, a ossatura conceitual fabricada por aquele, começa a se delinear. Os dirigentes não estão mais sequer muito interessados em encobri-lo, seu poder se fortalece quanto mais brutalmente ele se confessa de público. O cinema e o rádio não precisam mais se apresentar como arte. A verdade de que não passam de um negócio, eles a utilizam como uma ideologia destinada a legitimar o lixo que propriamente produzem. Eles se definem a si mesmos como indústrias, e as cifras publicadas dos rendimentos de seus diretores gerais suprimem toda dúvida quanto à necessidade social de seus produtos. HORKHEIMER, Max; ADORNO, Theodor. Dialética do esclarecimento. Rio de Janeiro: Jorge Zahar Ed., 1985, p. 114. Com base no texto e nos conhecimentos sobre indústria cultural em Adorno, considere as afirmativas a seguir. I. Os produtos da indústria cultural, como o cinema e o rádio, deixam de ser arte para se transformarem em um negócio visando apenas ao lucro. II. O acesso massificado aos produtos culturais faz com que a indústria cultural contribua para a formação do juízo estético dos sujeitos, democratizando a Arte. III. As criações artísticas produzidas no cinema e no rádio são resultado da criatividade e da autonomia de seus produtores, contribuindo para o processo de emancipação intelectual. IV. O cinema e o rádio, como exemplos de comunicação de massa, cumprem com a lógica comercial e econômica da sociedade na homogeneização cultural do consumo e do pensamento. Assinale a alternativa correta.", "options": ["Somente as afirmativas I e II são corretas.", "Somente as afirmativas I e IV são corretas.", "Somente as afirmativas III e IV são corretas.", "Somente as afirmativas I, II e III são corretas.", "Somente as afirmativas II, III e IV são corretas."], "subject": "Sociologia", "answer": "B", "image": false}, {"id": 4, "stem": "Leia a letra da canção “Homem primata”, dos Titãs, a seguir. Desde os primórdios Até hoje em dia O homem ainda faz O que o macaco fazia Eu não trabalhava Eu não sabia Que o homem criava E também destruía Homem primata Capitalismo selvagem Ô-ô-ô Homem primata Capitalismo selvagem Ô-ô-ô Eu aprendi A vida é um jogo Cada um por si E Deus contra todos Você vai morrer E não vai pro céu É bom aprender A vida é cruel [refrão] Eu me perdi Na selva de pedra Eu me perdi Eu me perdi I am a cave man, a young man I fight with my hands, with my hands I am a jungle man, a monkey man Concrete jungle, concrete jungle PESSOA, Ciro; FROMER, Marcelo; REIS, Nando; BRITTO, Sérgio. Homem primata. In: Cabeça Dinossauro, 1986. Com base na letra da canção, considere as afirmativas a seguir. I. O uso de paralelismos sugere ironicamente que, apesar dos avanços civilizatórios, a humanidade preserva os mesmos comportamentos primitivos. II. Os verbos no pretérito imperfeito (fazia, trabalhava, sabia, criava, destruía) indicam ações habituais e contínuas; já os verbos no pretérito perfeito (perdi, aprendi) marcam ações pontuais e concluídas. III. A figura de linguagem empregada em “o homem criava e também destruía” é a metonímia, pois existe uma relação de causalidade. IV. O uso da locução adverbial “até hoje em dia” indica tanto intensidade quanto modo, pois enfatiza a instabilidade e a exacerbação da selvageria humana. Assinale a alternativa correta.", "options": ["Somente as afirmativas I e II são corretas.", "Somente as afirmativas I e IV são corretas.", "Somente as afirmativas III e IV são corretas.", "Somente as afirmativas I, II e III são corretas.", "Somente as afirmativas II, III e IV são corretas."], "subject": "Português", "answer": "A", "image": false}, {"id": 5, "stem": "O tema da democracia racial é abordado nas obrasCasaGrande & Senzala(1933), de Gilberto Freyre, eA Integração do Negro na Sociedade de Classes(1965), de Florestan Fernandes. Os pensadores apresentaram argumentos acerca da constituição e formação da sociedade e das relações raciais brasileiras. Com base nos conhecimentos sobre democracia racial em Gilberto Freyre e Florestan Fernandes, considere as afirmativas a seguir. I. Os estudos de Fernandes distanciavam-se dos de Freyre, pois este afirmava que havia uma convivência pacífica entre os diferentes grupos étnicos, o que foi questionado por Fernandes. II. Freyre ressaltava que o negro havia sido incorporado gradativamente às estruturas sociais brasileiras e inserido num processo de miscigenação, enquanto que, para Fernandes, essa incorporação reforçou o racismo estrutural. III. A tese, defendida por Freyre, de que não havia racismo institucional, ocupou os discursos governamentais por anos, no entanto, para Fernandes, essa ideia naturalizou as desigualdades étnico-raciais. IV. A partir das evidências históricas apontadas por Freyre e Fernandes, a democracia racial fez-se presente após a abolição da escravidão, promovendo a cultura afrobrasileira. Assinale a alternativa correta.", "options": ["Somente as afirmativas I e II são corretas.", "Somente as afirmativas I e IV são corretas.", "Somente as afirmativas III e IV são corretas.", "Somente as afirmativas I, II e III são corretas.", "Somente as afirmativas II, III e IV são corretas."], "subject": "Sociologia", "answer": "D", "image": false}, {"id": 6, "stem": "Analise a imagem a seguir. Aparição de rosto e fruteira numa praia (1938). Em relação a essa obra de Salvador Dali, um dos principais expoentes das vanguardas artísticas do século XX, e ao movimento surrealista, considere as afirmativas a seguir. I. Utilizam a natureza como suporte e material, sendo efêmera no tempo. II. Valorizam a fantasia e a justaposição de objetos não relacionados. III. Exploram a imaginação e desafiam a percepção convencional da realidade. IV. Criam imagens bizarras, usam simbolismos e significados ocultos. Assinale a alternativa correta.", "options": ["Somente as afirmativas I e II são corretas.", "Somente as afirmativas I e IV são corretas.", "Somente as afirmativas III e IV são corretas.", "Somente as afirmativas I, II e III são corretas.", "Somente as afirmativas II, III e IV são corretas."], "subject": "Artes", "answer": "E", "image": true}, {"id": 7, "stem": "Leia o texto a seguir. A arte constrói numerosas representações do mundo, as quais podem ser sobre o mundo real ou sobre mundos imaginários, inexistentes, mas a inspiração humana continua podendo criar uma realidade para cada um deles. A realidade social inclui tais coisas como dinheiro, propriedade, sistemas econômicos, classes sociais, gênero, grupos étnicos, governos, sistemas de cerimoniais religiosos e crenças, linguagens e similares. As artes são representações simbólicas dessas realidades. [...] são importantes pedagogicamente porque espelham essas representações de forma que podem ser percebidas e sentidas. EFLAND. A. Cultura, sociedade, arte e educação em um mundo pós-moderno. In: BARBOSA, Ana Mae; GUINSBURG, J. (Org). O Pós-Modernismo. São Paulo: Perspectiva, 2005. p. 183. Imagens das instalações físicas do grupo e da produção da Cooperativa Cultural Eloísa Cartonera A produção da Cooperativa Cultural Eloísa Cartonera (Buenos Aires, Argentina) é resultado de um projeto realizado de forma colaborativa com catadores de papelão. A produção artesanal de livros nos faz pensar sobre outros modos de produzir arte, cultura e educação na perspectiva da Arte Contemporânea. Com base no texto e no projeto da Cooperativa Cultural Eloísa Cartonera, considere as afirmativas a seguir. I. O projeto vem ressignificar a produção artístico- -literária, trazendo a realidade social nas representações e produções. II. O projeto apresenta uma representação artística, cultural e social que rompe com os ditames da indústria cultural. III. O projeto ressalta o movimento que aposta na ousadia e na transgressão cultural, questionando o que está no centro ou à margem da produção artística tradicional. IV. O projeto colabora com a produção em larga escala de bens destinados ao mercado consumidor, descaracterizando as representações sociais e simbólicas. Assinale a alternativa correta.", "options": ["Somente as afirmativas I e II são corretas.", "Somente as afirmativas I e IV são corretas.", "Somente as afirmativas III e IV são corretas.", "Somente as afirmativas I, II e III são corretas.", "Somente as afirmativas II, III e IV são corretas."], "subject": "Artes", "answer": "D", "image": true}, {"id": 8, "stem": "Sobre as obras O seminarista, de Bernardo Guimarães, e Niketche, de Pauline Chiziane, considere as afirmativas a seguir. I. Em O seminarista, Eugênio é impedido de se casar devido à imposição do celibato, ao passo que Tony, em Niketche, possui cinco esposas. II. As experiências de Rami, em Niketche, e de Margarida, em O seminarista, são semelhantes, uma vez que ambas partilham do mesmo contexto socio-histórico. III. O seminaristaapresenta traços do regionalismo realista, como o determinismo do meio a hereditariedade. IV. Enquanto O seminaristaé narrado em terceira pessoa, Niketche é narrado em primeira pessoa. Assinale a alternativa correta.", "options": ["Somente as afirmativas I e II são corretas.", "Somente as afirmativas I e IV são corretas.", "Somente as afirmativas III e IV são corretas.", "Somente as afirmativas I, II e III são corretas.", "Somente as afirmativas II, III e IV são corretas."], "subject": "Literatura", "answer": "B", "image": false}, {"id": 9, "stem": "Com a crescente popularização das corridas de rua, novos tênis são desenvolvidos prometendo aumento de desempenho e prevenção de lesões. O fenômeno físico explorado por todas as marcas é a deformação elástica, que explica a capacidade de materiais se deformarem e retornarem à sua forma original. Para minimizar as lesões, os compostos das entressolas, como borrachas, EVAs e placas de carbono, podem absorver os impactos e devolver a energia acumulada. Com base nos conceitos de Força Elástica e Conservação de Energia, assinale a alternativa correta.", "options": ["Quando a força aplicada a uma mola é dobrada, a sua deformação diminui até atingir o seu valor mínimo igual a zero.", "Segundo a Lei de Hooke, a força elástica realiza trabalho e por isso é uma força dissipativa, o que resulta no aumento da energia mecânica.", "A Lei de Hooke descreve que a deformação é diretamente proporcional à força aplicada, observando as características específicas do material utilizado.", "Em um sistema massa-mola, com atrito desprezível, a energia potencial elástica tem seu valor máximo na posição inicial ou zero.", "Em um sistema massa-mola, com atrito desprezível, a energia cinética do objeto tem seu valor máximo quando a mola atinge a maior deformação possível."], "subject": "Física", "answer": "C", "image": false}, {"id": 10, "stem": "Com base nas obras Cartas chilenas, de Tomás Antônio Gonzaga, O rei da vela, de Oswald de Andrade, Chove sobre minha infância, de Miguel Sanches Neto, eMelhores poemas, de Fernando Pessoa, assinale a alternativa correta.", "options": ["Cartas chilenasestrutura-se como um diálogo conflituoso entre Critilo e Doroteu, já O rei da vela alterna o foco narrativo entre Abelardo I e Abelardo II.", "Os acontecimentos de Cartas chilenase de O rei da vela se passam no Brasil oitocentista, havendo em ambas as obras uma sátira aos desmandos das elites agrárias.", "Assim como Heloísa de Lesbos, de O rei da vela, Sebastião e Zé-Babé, em Chove sobre minha infância, representam a elite urbana cuja ascensão social se deu por meio dos estudos.", "Em Melhores poemas, nota-se que, enquanto os poemas de Alberto Caeiro ora exaltam a modernidade, ora refletem sobre o passado português, Álvaro de Campos adota o paganismo e cultiva formas fixas.", "Em Melhores poemas, há poemas assinados por Fernando Pessoa ortônimo e por seus heterônimos, enquanto Miguel Sanches Neto é o protagonista de Chove sobre minha infância."], "subject": "Literatura", "answer": "E", "image": false}, {"id": 11, "stem": "Leia a sentença a seguir. _______, no contexto educacional brasileiro, é um conjunto de práticas, valores, _______, expressões, saberes e manifestações que caracterizam um grupo ou sociedade. É valorizada como um meio de promover a identidade, a diversidade e o pertencimento em um país multicultural. ________ é um campo de conhecimento caracterizado pelas linguagens sonora, visual e corporal, envolvendo expressão, experimentação, ________, sensibilidade, pensamento crítico, ________, contribuindo para o desenvolvimento do ser humano. Com base nos conceitos de Arte e Cultura, assinale a alternativa que preenche correta e respectivamente as lacunas.", "options": ["Arte, Criação, Cultura, Fruição Estética, Crença.", "Cultura, Fruição Estética, Crença, Criação, Arte.", "Cultura, Crenças, Arte, Fruição Estética, Criação.", "Criação, Arte, Cultura, Crença, Fruição Estética.", "Criação, Crenças, Arte, Cultura, Fruição Estética."], "subject": "Artes", "answer": "C", "image": false}, {"id": 12, "stem": "Leia a letra da canção “Família”, dos Titãs, a seguir. 1. Família, família Papai, mamãe, titia Família, família Almoça junto todo dia Nunca perde essa mania 2. Mas, quando a filha quer fugir de casa, Precisa descolar um ganha-pão. Filha de família, se não casa, Papai, mamãe não dão nem um tostão. Família, eh, família, ah Família Família, eh, família, ah Família, oh 3. Família, família! Vovô, vovó, sobrinha Família, família Janta junto todo dia Nunca perde essa mania 4. Mas, quando o neném fica doente, Procura uma farmácia de plantão. O choro do neném é estridente, Assim não dá pra ver televisão [refrão] 5. Família, família Cachorro, gato, galinha Família, família Vive junto todo dia Nunca perde essa mania 6. A mãe morre de medo de barata, O pai vive com medo de ladrão. Jogaram inseticida pela casa, Botaram um cadeado no portão. [refrão] BELLOTTO, Tony; ANTUNES, Arnaldo. Família. In: Cabeça Dinossauro, 1986. Sobre a letra da canção, assinale a alternativa correta.", "options": ["A equivalência entre os medos materno e paterno, na sexta estrofe, revela uma valorização da mulher, pois seu medo justificado contraria os valores patriarcais da sociedade brasileira.", "A rima entre “casa” e “casa” na segunda estrofe é uma rima pobre, pois a letra apenas repete o mesmo vocábulo.", "O eu da canção é o filho adolescente, que narra a tentativa de fuga da irmã, bem como o cotidiano de sua família.", "Na segunda estrofe, depreende-se que a única forma de uma filha de família sair de casa é pelo casamento; do contrário, os pais renunciam à sua subsistência.", "A despeito da linguagem coloquial que perpassa a letra, há certa rigidez formal, pois todos os versos são octossílabos."], "subject": "Português", "answer": "D", "image": false}, {"id": 13, "stem": "Leia o texto a seguir. A redução do entesouramento∗ e a expansão do meio circulante ∗∗ refletem as reformas monetárias empreendidas para se adaptar à nova conjuntura. De fato, na economia de subsistência da Alta Idade Média, eram suficientes as moedas de baixo valor intrínseco que circulavam ainda em pequena quantidade; o denarius de prata correspondia àquela situação econômica contraída. Contudo, em 1202, as necessidades criadas por uma crescente economia comercial levaram Veneza a criar uma moeda de prata de valor bem maior, o matapan, correspondente a 24 denaril. Anos depois, tal iniciativa foi seguida por várias outras cidades italianas e ainda por Montpellier, Flandres, Inglaterra, Polônia e França. Em suma, as novas peças expressavam uma circulação monetária muito mais abundante. ∗ Entesouramento: ato de acumular ou reter riqueza, geralmente em forma de moedas ou metal precioso. ∗∗ Meio circulante: moeda corrente. Adaptado de: FRANCO JÚNIOR, Hilário. A primeira manifestação do crescimento econômico ocidental: a Europa feudal dos séculos XI-XIII. Revista de História, São Paulo, n. 116, p. 105–127, 1984. Por volta do ano 1000, após séculos de deflação e entesouramento, a crescente circulação de moedas na Europa gerou o fenômeno da chamada inflação de demanda, pois a elevação do poder de compra da população não foi imediatamente acompanhada pela ampliação de oferta do setor produtivo. Sobre a expansão da economia medieval e o aumento da circulação monetária no início da Baixa Idade Média, é correto afirmar que", "options": ["ocorreram devido ao fechamento da principal rota comercial da Europa com o Oriente após a tomada de Constantinopla pelos turcos otomanos, pondo fim à Idade Média.", "resultaram da introdução de metais preciosos cuja origem eram as colônias portuguesas e espanholas nas Américas, com destaque para as minas de Potosí, no Peru.", "ocorreram devido à multiplicação de obrigações e impostos feudais, como a talha, a corveia e a mão morta, os quais eram pagos em moedas pelos servos ao senhor feudal.", "resultaram da substituição de moedas cunhadas em metal precioso por cédulas de papel ou títulos ao portador, emitidos pelos governos monárquicos europeus.", "resultaram do renascimento comercial e urbano, do crescente comércio com o Oriente e do desentesouramento de metais preciosos que entraram em circulação."], "subject": "História", "answer": "E", "image": false}, {"id": 14, "stem": "Analise as imagens a seguir. I. Portinari II. Tarsila do Amaral III. Cildo Meireles IV. Debret Assinale a alternativa que apresenta, corretamente, a relação entre as imagens e os movimentos artísticos.", "options": ["I. Expressionismo; II. Contemporâneo; III. Neoclassicismo; IV. Modernismo.", "I. Expressionismo; II. Modernismo ; III. Contemporâneo; IV. Neoclassicismo.", "I. Modernismo; II. Neoclassicismo; III. Contemporâneo; IV. Expressionismo.", "I. Modernismo; II. Expressionismo; III. Neoclassicismo; IV. Contemporâneo.", "I. Neoclassicismo; II. Modernismo ; III. Expressionismo; IV. Contemporâneo."], "subject": "Artes", "answer": "B", "image": true}, {"id": 15, "stem": "Com base nos conhecimentos e abordagens da Sociologia Clássica sobre o capitalismo, assinale a alternativa correta.", "options": ["De acordo com K. Marx, o capitalismo sustenta-se, entre outros fatores, pela propriedade privada, pela divisão da sociedade em classes sociais antagônicas e pela exploração do trabalho assalariado.", "E. Durkheim e M. Weber consideram que a ação social com relação a valores foi o principal motor propulsor do desenvolvimento capitalista do século XIX.", "De acordo com E. Durkheim, a coercitividade dos fatos sociais tem origem na divisão social do trabalho, produzindo solidariedade e unidade no modo de produção capitalista.", "Segundo M. Weber, a expansão do fenômeno religioso no século XX foi responsável pela crise e enfraquecimento do modo de produção capitalista em toda a Europa.", "K. Marx e E. Durkheim possuem perspectivas teóricas semelhantes em relação à solidariedade mecânica, pois ambos consideram sua importância para manter a interdependência entre os indivíduos no capitalismo."], "subject": "Sociologia", "answer": "A", "image": false}, {"id": 16, "stem": "Uma das funcionalidades, divulgada como diferencial em alguns modelos de smartphones, é o carregamento sem fio da bateria. A tecnologia existe desde a década de 1990 e utiliza o fenômeno da indução eletromagnética. Basicamente, um carregador sem fio contém uma bobina em seu interior que gera um campo magnético variável. Quando o celular é posicionado sobre o carregador, esse campo gerado atravessa uma bobina dentro do celular, resultando no carregamento da bateria. Com base nos conhecimentos sobre eletromagnetismo, assinale a alternativa correta.", "options": ["A indução eletromagnética é um fenômeno que ocorre quando a variação de um campo magnético que atravessa uma bobina gera nesta o surgimento de uma corrente induzida.", "A corrente elétrica induzida na bobina do celular gera um campo magnético com mesma direção e sentido do campo magnético da bobina do carregador.", "O fluxo do campo magnético gerado pelo carregador, que atravessa o plano da bobina do celular, tem valor máximo quando o plano dessa bobina é paralelo às linhas do campo magnético.", "O fenômeno da indução eletromagnética possibilita a geração de energia elétrica dentro do celular devido à transferência de energia através da propagação do calor.", "O campo magnético constante, gerado pelo carregador, produz uma força eletromotriz de alta intensidade na bobina do celular, causando o seu aquecimento."], "subject": "Física", "answer": "A", "image": false}, {"id": 17, "stem": "Leia o texto e observe as imagens a seguir. Nesses quadriláteros de maneira arbitrária cavados no coração da floresta, as ruas em ângulo reto são, de início, todas parecidas: traçados geométricos, privados de qualidade própria. Claude Lévi-Strauss, Tristes Trópicos, 1996, p.114 Londrina Cambé Rolândia   As plantas das cidades de Londrina, Cambé e Rolândia foram delineadas por Alexander Rasgulaeff, funcionário da empresa Companhia de Terras Norte do Paraná, que ocupou e desenvolveu a região. Assinale a alternativa que caracteriza, corretamente, a morfologia histórica urbana implementada a partir dos anos 1930 na região Norte do Paraná.", "options": ["Aproveitou-se das trilhas e caminhos que ligavam as aldeias indígenas da região para a projeção do traçado destas cidades.", "Foi feita a partir das contribuições da viagem de BiggWitter à ocupação da região em meados do século XIX.", "Foi inspirada na ideia de Cidade Jardim, criada por Ebenezer Howard no final do século XIX, na Inglaterra.", "Devido ao processo de ocupação, nos pontos mais altos dessas cidades, foram construídos templos anglicanos e luteranos.", "Foi concebida dentro das tendências do urbanismo russo, que estabelecia autonomia econômica entre as cidades."], "subject": "Geografia", "answer": "C", "image": true}, {"id": 18, "stem": "O Brasil tem passado por importantes transformações no seu processo de urbanização. Entende-se como urbanização, a concentração da população em algumas cidades, metrópoles e aglomerações urbanas. Nesse sentido, é preciso compreender a complexidade das cidades a partir das atividades econômicas, da concentração e dispersão territorial e da dinâmica populacional. Sobre a urbanização brasileira, assinale a alternativa correta.", "options": ["A expansão urbana tem contribuído para o aumento dos problemas ambientais e sociais, sobretudo nas periferias, muitas vezes acompanhada por um processo de crescimento desordenado e informal.", "O espaço urbano apresenta semelhanças nos valores imobiliários, nas relações entre as pessoas da sociedade ou no padrão arquitetônico da cidade, promovendo a integração de todos.", "O território urbano é unificado pelos transportes, comunicações e mercado, potencializando a interligação dos espaços e tornando a urbanização um fenômeno homogêneo sobre o espaço nacional.", "O processo de urbanização no Brasil tem promovido a completa integração econômica e social entre as regiões metropolitanas, garantindo uniformidade no acesso à infraestrutura, aos serviços e às oportunidades.", "O processo de urbanização se fez de forma equitativa entre as cidades, refletindo um planejamento eficaz, que minimiza os desafios socioambientais ligados às mudanças climáticas atuais. Leia o texto a seguir e responda às questões 19 e 20. OCDE aponta que 21% dos brasileiros possuem Ensino Superior Apenas 21% dos jovens brasileiros, entre 25 e 34 anos, concluíram o Ensino Superior, segundo o levantamento “Education at Glance”, elaborado pela Organização de Cooperação e Desenvolvimento Econômico (OCDE), publicado no final de 2021. O estudo aponta que essa é a média mais baixa entre os países analisados na América Latina: Argentina (40%), Chile (34%), Colômbia (29%) e Costa Rica (28%). A média entre os países pertencentes à OCDE é de 44%. No Brasil, apenas 0,84% das pessoas entre 25 e 64 anos com Ensino Superior completo possuem mestrado, a média da OCDE é de 14,33%. O acesso ao mercado de trabalho para os brasileiros que possuem graduação, mestrado e doutorado é, respectivamente, 86%, 73% e 83%. A média mundial aponta que quanto maior o nível de estudo, maiores são as oportunidades: 83% (graduação), 87% (mestrado) e 90% (doutorado). Adaptado de: www.terra.com.br/noticias"], "subject": "Geografia", "answer": "A", "image": false}, {"id": 19, "stem": "Com base no texto, considere as afirmativas a seguir. I. Entre os países da América Latina mencionados, o Brasil é o que apresenta média mais baixa de jovens com ensino superior completo, o que expressa a desigualdade educacional existente entre tais países. II. O fenômeno do baixo índice de conclusão do ensino superior no Brasil se deve ao fato de os indivíduos considerarem a educação um mecanismo de reprodução das desigualdades no capitalismo. III. No Brasil, a razão entre o número de pessoas, de 25 a 64 anos, com Ensino Superior completo e as que possuem mestrado, é 20 vezes menor que a média da OCDE. IV. No Brasil, a cada 500 jovens, entre 25 e 34 anos, 105 concluíram o Ensino Superior, enquanto no grupo de países pertencentes à OCDE foram 220 concluintes para cada 500 jovens. Assinale a alternativa correta.", "options": ["Somente as afirmativas I e II são corretas.", "Somente as afirmativas I e IV são corretas.", "Somente as afirmativas III e IV são corretas.", "Somente as afirmativas I, II e III são corretas.", "Somente as afirmativas II, III e IV são corretas."], "subject": "Matemática", "answer": "B", "image": false}, {"id": 20, "stem": "Leia os seguintes trechos da notícia sobre o levantamento elaborado pela OCDE (2021). 1) O acesso ao mercado de trabalho para os brasileiros quepossuem graduação, mestrado e doutorado é, respectivamente, 86%, 73% e 83%. 2) O estudo aponta que essa é a média mais baixa entre os países analisados na América Latina. 3) A média mundial aponta que quanto maior o nível de estudo, maiores são as oportunidades. Com base nos trechos, assinale a alternativa correta.", "options": ["No trecho 1, o termo “respectivamente” indica que o acesso ao mercado de trabalho é de 86%, 73% e 83% tanto para quem possui graduação, quanto para quem possui mestrado e doutorado.", "No trecho 2, a oração subordinada substantiva objetiva indireta, introduzida pela conjunção integrante “que”, tem a função de caracterizar o sujeito da primeira oração (o estudo).", "No trecho 3, a oração subordinada adjetiva explicativa, introduzida pela conjunção integrante “que”, tem a função de acrescentar uma informação sobre o acesso ao mercado de trabalho pelos brasileiros.", "No trecho 1, a oração subordinada adjetiva restritiva, introduzida pelo pronome relativo “que”, tem a função de mostrar o acesso restrito ao mercado de trabalho a determinados brasileiros.", "No trecho 3, o sentido de concessão apresentado em: “A média mundial aponta que quanto maior o nível de estudo, maiores são as oportunidades” é mantido em “A média mundial aponta que, se o nível de estudo fosse maior, maiores seriam as oportunidades”."], "subject": "Português", "answer": "D", "image": false}, {"id": 21, "stem": "O gráfico a seguir relaciona o percentual da quantidade de influenciadores digitais brasileiros, por gênero, com suas respectivas faixas de renda mensal. [...] O estudo apontou que 75% dos influenciadores digitais são mulheres, enquanto 25% são homens. Apesar da presença feminina ser predominante, a desigualdade de ganhos é evidente.  [...] Aqui no Brasil, a população de influencers gira em torno de 13,5 milhões, de acordo com dados da YouPix e Nielsen [...]  Com base no gráfico, nos trechos das reportagens e supondo que a população brasileira seja de 210 milhões de habitantes, considere as afirmativas a seguir. I. A quantidade de homens influenciadores digitais que têm renda mensal de até 2 mil reais representa menos de 1 4 da quantidade de mulheres influenciadoras nessa mesma faixa de renda. II. A probabilidade de se tomar um(a) brasileiro(a), ao acaso, e este(a) ser um(a) influenciador(a) digital cujo recebimento mensal ultrapasse 100 mil reais é maior que 0,005. III. A profissão de influenciador digital possibilita a mudança e a mobilidade entre classes sociais no Brasil, reconfigurando as questões de gênero. IV. Há o predomínio de mulheres influenciadoras digitais no Brasil: cerca de 59% destas ganham entre 2 mil reais e 10 mil reais mensais. Tais dados indicam que as desigualdades de gênero persistem. Assinale a alternativa correta.", "options": ["Somente as afirmativas I e II são corretas.", "Somente as afirmativas I e IV são corretas.", "Somente as afirmativas III e IV são corretas.", "Somente as afirmativas I, II e III são corretas.", "Somente as afirmativas II, III e IV são corretas."], "subject": "Matemática", "answer": "B", "image": true}, {"id": 22, "stem": "Leia e complete o texto a seguir. Movimentos sociais são ações coletivas de caráter _________, construídas por _________ sociais pertencentes a diferentes classes e camadas sociais. Eles _________ suas demandas e criam um campo político de força social na sociedade civil. Suas ações estruturam-se a partir de repertórios criados sobre temas e problemas em situações de _________, litígios e disputas. As ações desenvolvem um processo social e político cultural que cria uma _________ coletiva ao movimento, a partir de interesses em comum [...]. GOHN, Maria da Glória. 500 anos de lutas sociais no Brasil: movimentos sociais, ONGs e terceiro setor. p. 13. Rev. Mediações, Londrina, v. 5, p. 11-40, jan./jun. 2000. A socióloga Maria da Glória Gohn define os movimentos sociais como instrumentos fundamentais para os processos democráticos. Considerando a definição da autora, assinale a alternativa que preenche correta e respectivamente as lacunas do texto.", "options": ["socioeconômico, princípios, neutralizam, coerções, identidade.", "jurídico, princípios, politizam, autoridades, ação.", "sociopolítico, repertórios, solucionam, coerções, ação.", "socioeconômico, atores, neutralizam, conflitos, ideologia.", "sociopolítico, atores, politizam, conflitos, identidade."], "subject": "Sociologia", "answer": "E", "image": false}, {"id": 23, "stem": "No Brasil, em 2022, apenas 4% dos resíduos como vidros, plásticos, papéis, metais e baterias foram reciclados. Esse índice é muito baixo e demonstra o quanto é possível ampliar a cadeia da reciclagem no país. Tal processo, além de gerar valor agregado aos materiais, contribui para a redução da poluição ambiental. Sobre os processos físicos, químicos e as transformações que ocorrem na reciclagem dos materiais, considere as afirmativas a seguir. I. Os vidros são formados majoritariamente por sílica (SiO2) e sua reciclagem, quando baseada na fusão e posterior moldagem, caracteriza-se como um processo físico. II. Os plásticos são polímeros constituídos por cadeias de monômeros e quando a reciclagem ocorre por meio do retorno do polímero à sua composição primária (monômero) caracteriza-se como um processo químico. III. A reciclagem de plásticos por meio da incineração, produzindo vapor e calor, caracteriza-se como um processo físico. IV. O zinco metálico, elemento químico contido em pilhas, quando reciclado pelo aquecimento a altas temperaturas, é volatilizado e recuperado, caracterizando um processo químico. Assinale a alternativa correta.", "options": ["Somente as afirmativas I e II são corretas.", "Somente as afirmativas I e IV são corretas.", "Somente as afirmativas III e IV são corretas.", "Somente as afirmativas I, II e III são corretas.", "Somente as afirmativas II, III e IV são corretas."], "subject": "Química", "answer": "A", "image": false}, {"id": 24, "stem": "Leia o texto a seguir. Sem abandonar o vosso assunto de Lisboa, deveis convir, por exemplo, que a natureza não havia absolutamente ajuntado ali vinte mil casas de seis a sete andares, e que se os habitantes desta grande cidade estivessem espalhados mais igualmente e mais levemente alojados, o estrago teria sido muito menor, e talvez, nulo. Todos teriam fugido ao primeiro abalo, e no dia seguinte teriam sido vistos a vinte léguas de lá, tão alegres como se nada tivesse acontecido; mas foi preciso ficar, teimar em permanecer em volta das casas, expor- -se a novos tremores, porque o que se deixa vale mais do que aquilo que se pode levar. Rousseau, Jean-Jacques. Carta de J.J. Rousseau ao Senhor de Voltaire. In: Jean-Jacques Rousseau: escritos sobre religião e moral. Tradução de: Adalberto L. Vicente; Ana L. S. Camarini e José Oscar de A. Marques. Cadernos de Tradução, vol. 2. Campinas. IFCH. 2006, p. 162. O Terremoto de Lisboa (1755) ocorreu durante a crise do Absolutismo em Portugal e a promoção do Iluminismo no governo de Marquês de Pombal, que estabeleceu reformas para conter as diversas crises pelas quais o Reino passava. Sobre o Período Pombalino (1750-1777), assinale a alternativa correta.", "options": ["Ocorreu o fortalecimento da escravidão negra como alternativa à carência de mão de obra para a reconstrução da capital da metrópole.", "Foi autorizada a atuação da Ordem de São Francisco para estabelecer a leitura naturalista do fenômeno ocorrido em 1755.", "Estabeleceu-se a garantia da liberdade religiosa ao autorizar a fundação de escolas dirigidas pelas igrejas reformadas em toda extensão do império colonial.", "A influência religiosa foi minimizada com políticas anticlericais como a expulsão da Companhia de Jesus da colônia do Brasil em 1759.", "Sob influência dos ideais iluministas em Portugual no século VIII, atribuía-se o fenômeno tectônico aos desvios morais dos portugueses."], "subject": "História", "answer": "D", "image": false}, {"id": 25, "stem": "Leia o texto a seguir.  Com base no texto, assinale a alternativa que apresenta, corretamente, o objetivo da experiência descrita.", "options": ["Transmitir dados científicos e explicações técnicas sobre a origem de terremotos e tsunamis, por meio do uso de simuladores.", "Conduzir os visitantes a uma vivência sensorial que explora aspectos históricos, científicos e culturais do terremoto de Lisboa.", "Causar uma atividade sísmica de forma a promover uma experiência real do fenômeno.", "Alertar os moradores de Lisboa sobre o risco de terremotos e tsunamis e possíveis rotas de escape.", "Promover uma experiência visual e tátil aos interessados, incluindo gestantes e cardíacos."], "subject": "História", "answer": "B", "image": true}, {"id": 26, "stem": "Leia o trecho de Torto Arado, de Itamar Vieira Júnior, a seguir. No hospital, demoramos a ser atendidas. Nossos pais estavam encolhidos em um canto ao nosso lado. Vi as calças sujas de terra que ele não teve tempo de trocar. [...] Meu pai ainda segurava a língua envolta na mesma camisa. As folhas estavam guardadas nos bolsos de sua calça, talvez por vergonha de o apontarem com desdém como feiticeiro dentro daquele lugar que ele não conhecia. Foi o primeiro lugar em que vi mais gente branca que preta. E vi como as pessoas nos olhavam com curiosidade, mas sem se aproximar. [...] Nossas feridas foram suturadas, e permanecemos juntas por mais dois dias. Saímos com um carregamento de antibióticos e analgésicos nas mãos. Teríamos que voltar dali a duas semanas para retirar os pontos. [...] Nunca havíamos andado no Ford Rural da fazenda ou em qualquer outro automóvel. E como era diferente o mundo além de Água Negra! Como era diferente a cidade com suas casas grudadas umas às outras, dividindo paredes. As ruas calçadas com pedras. O chão das nossas casas e dos caminhos da fazenda eram de terra. De barro, apenas, que também servia para fazer a comida de nossas bonecas de sabugo, e de onde brotava quase tudo que comíamos. Onde enterrávamos os restos do parto e o umbigo dos nascidos. VIEIRA JUNIOR, Itamar. Torto arado. São Paulo: Todavia, 2019. p. 18-19; 20. Com base no trecho e na leitura integral da obra, assinale a alternativa correta.", "options": ["O romance é todo narrado por Belonísia, que conta a história de como sua irmã se acidentou com a faca de Donana.", "“Meu pai ainda segurava a língua” é uma metáfora para o acanhamento do pai, que se envergonha de suas roupas sujas na cidade grande.", "Observa-se uma oposição entre cidade e campo, entre as religiões de matriz africana no meio rural e a ciência e a técnica (remédios, automóveis e asfalto) no meio urbano.", "Observa-se o uso do discurso direto em “as pessoas nos olhavam com curiosidade”, pois o narrador assume o ponto de vista de outra personagem.", "Os médicos demoram a atendê-las propositalmente, pois sabem que as irmãs se feriram numa briga por causa de Severo, um militante do Partido Comunista. Observe a imagem, leia o poema e responda às questões de 27 a 29.  O menino da sua mãe No plaino abandonado Qua a morna brisa aquece, De balas transpassado – Duas, de lado a lado –, Jaz morto, e arrefece. Raia-lhe a farda o sangue. De braços estendidos, Alvo, louro, exangue, Fita com olhar langue E cego os céus perdidos. Tão jovem! que jovem era! (Agora que idade tem?) Filho único, a mãe lhe dera Um nome e o mantivera: «O menino de sua mãe». Caiu-lhe da algibeira A cigarreira breve. Dera-lha a mãe. Está inteira E boa a cigarreira. Ele é que já não serve. De outra algibeira, alada Ponta a roçar o solo, A brancura embainhada De um lenço... Deu-lho a criada Velha que o trouxe ao colo. Lá longe, em casa, há a prece: «Que volte cedo, e bem!» (Malhas que o Império tece!) Jaz morto, e apodrece, O menino da sua mãe PESSOA, Fernando. Poesias. (Nota explicativa de João Gaspar Simões e Luiz de Montalvor.) Lisboa: Ática, 1942 (15ª ed. 1995). 217. 1ª publ. in Contemporânea , 3ª série, nº 1. Lisboa: 1926."], "subject": "Literatura", "answer": "C", "image": false}, {"id": 27, "stem": "Com base no poema e na imagem, assinale a alternativa correta.", "options": ["É possível verificar que, assim como no poema, na imagem de um soldado acompanhado por um robô, há exclusiva exaltação da ação heroica e da bravura dos soldados na guerra.", "Tanto a imagem quanto o poema valorizam o combate como uma maneira de reafirmar o patriotismo, o desejo pela liberdade e a soberania de um país, seja pelos embates corpo a corpo seja por meio do uso de tecnologias.", "O tema da guerra permeia tanto a imagem quanto o poema, mas enquanto este destaca o sofrimento causado pela morte de um jovem soldado no confronto, aquela sugere que o avanço tecnológico pode reduzir a presença humana no campo de batalha.", "O poema trata a guerra de forma amistosa, enquanto a imagem evidencia o fim dos confrontos armados e o uso de robôs nas ações militares, proporcionando guerras estratégicas e virtuais, portanto sem perdas de vidas.", "Tanto no poema quanto na imagem, o soldado é retratado como uma figura simbólica, sem relação com a realidade cotidiana das guerras que mostram cenários de destruição e caos."], "subject": "Literatura", "answer": "C", "image": true}, {"id": 28, "stem": "Em “O menino da sua mãe”, Fernando Pessoa faz uso dos pronomes oblíquos “lhe”, “lha” e “lho” para estabelecer relações de sentido, coesão textual e tom afetivo ao poema. Sobre o uso desses pronomes no poema, considere as afirmativas a seguir. I. Em “Deu-lho a criada velha”, “lho” é formado pela junção de “lhe” + “o”, os quais exercem a função de objeto indireto e direto e indicam que a criada deu ao menino o lenço. II. O pronome “lhe” em “Caiu-lhe da algibeira a cigarreira” exerce a função de objeto indireto e foi usado com sentido possessivo. III. No verso “Raia-lhe a farda o sangue”, o pronome “lhe” desempenha a função de sujeito da ação, referindo-se ao sangue que raia a farda do soldado. IV. Em “Filho único, a mãe lhe dera um nome”, o pronome “lhe” exerce a função de sujeito simples do verbo “dar” e refere-se à mãe. Assinale a alternativa correta.", "options": ["Somente as afirmativas I e II são corretas.", "Somente as afirmativas I e IV são corretas.", "Somente as afirmativas III e IV são corretas.", "Somente as afirmativas I, II e III são corretas.", "Somente as afirmativas II, III e IV são corretas."], "subject": "Português", "answer": "A", "image": false}, {"id": 29, "stem": "Sobre o poema O menino de sua mãe, de Fernando Pessoa, considere as afirmativas a seguir. I. Os versos da primeira estrofe são heptassílabos e compostos, quanto à classificação fonética, com rimas agudas e esdrúxulas. II. Tanto a cigarreira quanto o lenço referenciados no poema simbolizam o afeto familiar, representando os cuidados pessoais recebidos pelo jovem soldado. III. O verso “(Malhas que o Império tece!)” sugere uma crítica ao tratamento impessoal e indiferente das instituições em relação ao sofrimento individual. IV. Observa-se o emprego da hipálage em “plaino abandonado”, “céus perdidos” e “cigarreira breve”, pois as características referem-se, na verdade, ao menino e não a esses elementos. Assinale a alternativa correta.", "options": ["Somente as afirmativas I e II são corretas.", "Somente as afirmativas I e IV são corretas.", "Somente as afirmativas III e IV são corretas.", "Somente as afirmativas I, II e III são corretas.", "Somente as afirmativas II, III e IV são corretas."], "subject": "Literatura", "answer": "E", "image": false}, {"id": 30, "stem": "A expressão “racismo ambiental” é atribuída ao reverendo negro Benjamin Chavis, que, ainda adolescente, participou das lutas pelos direitos civis nos Estados Unidos. Atualmente, tal conceito tem ganhado relevância no debate socioambiental. Com base nos conhecimentos sobre racismo ambiental, considere as afirmativas a seguir. I. A resiliência das comunidades diante dos fenômenos naturais é determinada pela adaptação natural das populações às condições do território em que vivem ao longo do tempo. II. O racismo ambiental recai sobre grupos vulnerabilizados, muitas vezes, afetados por fenômenos como inundações ou deslizamentos, devido à localização de suas moradias. III. A presença de comunidades em áreas de risco é uma consequência direta do racismo estrutural, que influencia a distribuição desigual de recursos e a ocupação do território. IV. O racismo ambiental e a injustiça ambiental são termos correlatos e que fazem referência à maneira como a degradação do meio ambiente impacta as várias camadas da população de modo distinto. Assinale a alternativa correta.", "options": ["Somente as afirmativas I e II são corretas.", "Somente as afirmativas I e IV são corretas.", "Somente as afirmativas III e IV são corretas.", "Somente as afirmativas I, II e III são corretas.", "Somente as afirmativas II, III e IV são corretas."], "subject": "Geografia", "answer": "E", "image": false}, {"id": 31, "stem": "Leia o texto a seguir. Em 1692, a colônia da Baía de Massachussetts executou por bruxaria catorze mulheres, cinco homens e dois cachorros. A feitiçaria se materializou em janeiro, o primeiro enforcamento aconteceu em junho, o último em setembro. Seguiu-se um rígido silêncio chocado. O que incomodou os sobreviventes não foi a maliciosa prática de bruxaria, mas a desastrada aplicação da justiça. Parece que inocentes foram enforcados, enquanto alguns culpados escaparam. SCHIFF, Stacy.As bruxas: Intriga, traição e histeria em Salem. São Paulo: Zahar. Edição do Kindle, 2019. A localidade de Salem, na Nova Inglaterra, tornou-se conhecida pela perseguição a jovens acusadas de possessão demoníaca e bruxaria no final do século XVII. Há especialistas que explicam as supostas possessões como uma espécie de delírio coletivo estimulado pelo ambiente moralmente rígido e a crença em forças sobrenaturais que atuavam na comunidade. A região onde estava Salem apresentava clima temperado semelhante ao da Inglaterra, por isso não desenvolveu uma economia agrícola complementar à da metrópole, especializando-se em construção naval e comércio marítimo. Com base no texto e nos conhecimentos sobre a colonização e vida religiosa na América inglesa, considere as afirmativas a seguir. I. Nas 13 Colônias da América inglesa, havia grande variedade de igrejas e denominações religiosas, como anglicanos, presbiterianos, batistas, quakers e, ainda que em menor número, católicos. II. Nas colônias da Nova Inglaterra, predominou a grande propriedade fundiária e a produção de gêneros tropicais para o mercado atlântico, como o açúcar de cana, o tabaco e o cacau. III. Na América inglesa, o combate às heresias era feito pelo Tribunal do Santo Ofício, órgão da Igreja Católica responsável pela investigação, julgamento e execução das penas da Inquisição. IV. Na América inglesa, predominou o trabalho livre e assalariado nos territórios da Nova Inglaterra, enquanto nas colônias do Sul, utilizou-se da mão de obra de escravizados africanos. Assinale a alternativa correta.", "options": ["Somente as afirmativas I e II são corretas.", "Somente as afirmativas I e IV são corretas.", "Somente as afirmativas III e IV são corretas.", "Somente as afirmativas I, II e III são corretas.", "Somente as afirmativas II, III e IV são corretas. Leia o texto a seguir e responda às questões 32 e 33. Adaptado de:"], "subject": "História", "answer": "B", "image": false}, {"id": 32, "stem": "Em relação à preocupação expressa por Wren Hinks no texto, assinale a alternativa correta.", "options": ["As políticas de Trump causarão novos protestos nos Estados Unidos.", "Os EUA se tornarão dependentes de organizações internacionais.", "As agências científicas federais estão se concentrando demais em questões ambientais.", "Os habitantes de Nashville serão amplamente prejudicados na oferta de alimentos.", "O corte de programas científicos prejudicará o bem-estar público."], "subject": "Inglês", "answer": "E", "image": true}, {"id": 33, "stem": "Com base no texto, considere as afirmativas a seguir. I. Os protestos ocorridos em 07 de março de 2025 focaram nos cortes de financiamento aplicados às organizações locais de direitos humanos e de igualdade de gênero. II. A eliminação de programas e os cortes orçamentários às agências científicas promovidos pelo governo Trump tiveram como consequência imediata um aumento da confiança pública nas políticas científicas e ambientais do governo. III. Os cortes sucessivos de financiamentos e a eliminação de programas específicos desencadearam um movimento de resistência da comunidade científica, refletindo a preocupação com os efeitos dessas medidas para a sociedade e o meio ambiente. IV. O movimento “Stand Up for Science” surgiu como uma resposta aos impactos adversos provocados pela administração Trump, como a eliminação de programas de saúde global, a descontinuação de políticas ambientais e os cortes no financiamento da pesquisa científica. Assinale a alternativa correta.", "options": ["Somente as afirmativas I e II são corretas.", "Somente as afirmativas I e IV são corretas.", "Somente as afirmativas III e IV são corretas.", "Somente as afirmativas I, II e III são corretas.", "Somente as afirmativas II, III e IV são corretas."], "subject": "Inglês", "answer": "C", "image": true}, {"id": 34, "stem": "Cientistas relatam que, após um desastre ambiental de grande porte, como a inundação ocorrida em Porto Alegre-RS, em 2024, uma das fontes de odor desagradável são os gases provenientes da degradação, por microrganismos, da arginina (C 6H14N4O2), um aminoácido presente nas proteínas musculares dos animais em decomposição. Em lama densa, há liberação de metano (CH4) e amônia (NH3), de acordo com a equação química balanceada. C6H14N4O2(s) + 6H2O(l) →2 CH4(g) + 4 NH3(g) + 4 CO2(g) + 3 H2(g) Considerando a degradação anaeróbica total de 87 g de arginina na CNTP, determine a soma do volume dos gases CH4 e NH3 que é liberado. Dados: Massa molar da arginina = 174 g mol−1 Massa molar do CH4 = 16 g mol−1 Massa molar da NH3 = 17 g mol−1 Volume molar na CNTP = 22,4 L", "options": ["22,4 L", "33,6 L", "44,8 L", "67,2 L", "89,6 L"], "subject": "Química", "answer": "D", "image": false}, {"id": 35, "stem": "Em maio de 2025, o IBGE apresentou um mapa-múndi que posiciona o Brasil no centro do mundo e traz uma nova perspectiva, em que o Sul aparece no topo, exibindo uma mudança significativa na representação cartográfica usual. Adaptado de: IBGE 2025. www.ibge.gov.br Com base nessa perspectiva visual e nos conhecimentos sobre cartografia, assinale a alternativa correta.", "options": ["A inversão da orientação do mapa altera as coordenadas geográficas de latitude e longitude de todas as localidades, exigindo um novo sistema de referência global.", "Em um mapa-múndi com o Sul no topo, a determinação dos fusos horários a leste e oeste de Greenwich permanece igual, pois a rotação da Terra e a Linha Internacional de Data são os fatores determinantes.", "Mapas com o Sul no topo são tecnicamente mais precisos para representar as áreas dos continentes do Hemisfério Sul, corrigindo distorções inerentes às projeções que privilegiam o Hemisfério Norte.", "A escolha de posicionar o Sul no topo influencia diretamente a contagem dos graus de latitude, fazendo com que o Equador passe a ser 90◦ Sul e o Polo Sul 0◦.", "Projeções cartográficas que utilizam o Sul no topo demonstram uma superioridade intrínseca para navegação marítima, pois facilitam a visualização das correntes oceânicas do Pacífico Sul."], "subject": "Geografia", "answer": "B", "image": true}, {"id": 36, "stem": "No Conclave ocorrido em maio de 2025, para decidir o sucessor do Papa Francisco, foi eleito como pontífice o então Cardeal Robert Prevost, que assumiu com o nome de Leão XIV. O último papa Leão, foi o XIII, que governou a Igreja Católica no final do século XIX, momento em que a classe operária se levantava contra o capitalismo. Em resposta a esses conflitos, ele proclamou a Encíclica Rerum Novarum. Sobre as características deste documento papal, considere as afirmativas a seguir. I. Estabeleceu a Doutrina Social da Igreja, condenando as teorias materialistas, que buscavam organizar o proletariado, e reconhecendo que o capitalismo exacerbava na exploração do trabalho. II. Defendeu a classe operária dentro do capitalismo, pregando o entendimento entre patrões e empregados e condenando os levantes de trabalhadores, insuflados pelos comunistas e anarquistas. III. Criou as condições para a abertura da Igreja Católica aos apelos da modernidade, rompendo com a tradição tridentina ao autorizar a missa nas línguas nacionais. IV. Propiciou uma guinada ultraconservadora da Igreja Católica ao aproximar a Santa Sé dos partidos de orientação marxista. Assinale a alternativa correta.", "options": ["Somente as afirmativas I e II são corretas.", "Somente as afirmativas I e IV são corretas.", "Somente as afirmativas III e IV são corretas.", "Somente as afirmativas I, II e III são corretas.", "Somente as afirmativas II, III e IV são corretas."], "subject": "História", "answer": "A", "image": false}, {"id": 37, "stem": "Por que os vagalumes brilham? Vagalumes ou pirilampos são insetos da ordem Coleoptera, muito conhecidos pelo fenômeno da bioluminescência, que consiste na capacidade de produzir e emitir luz. Neste processo, a reação química ocorre entre a luciferina e o oxigênio e usa ATP (adenosina trifosfato) como fonte de energia e a enzima luciferase, permitindo a produção da energia luminosa sem calor. Sobre os insetos e os conhecimentos químicos decorrentes do fenômeno de bioluminescência, considere as afirmativas a seguir. I. Os coleópteros são caracterizados por um par de asas espessas e rígidas denominadas élitros. II. Os vagalumes são artrópodes hexápodes alados, com cabeça, tórax e abdômen. III. Na reação química, a enzima luciferase é uma proteína. IV. O ATP é usado como catalisador para aumentar o rendimento da reação. Assinale a alternativa correta.", "options": ["Somente as afirmativas I e II são corretas.", "Somente as afirmativas I e IV são corretas.", "Somente as afirmativas III e IV são corretas.", "Somente as afirmativas I, II e III são corretas.", "Somente as afirmativas II, III e IV são corretas."], "subject": "Biologia", "answer": "D", "image": false}, {"id": 38, "stem": "A dormência da semente é uma maneira de as plantas enfrentarem as variações nas condições ambientais. A germinação é a retomada do crescimento e da diferenciação do embrião e depende de diversos fatores, principalmente água, oxigênio e temperatura adequados. A figura a seguir apresenta, de forma simplificada, as etapas sequenciais que ocorrem durante a germinação. Adaptado de: LINHARES, Sérgio. Biologia hoje/ LINHARES, Sérgio; GEWANDSZNAJDER, Fernando; PACCA, Helena. 3. ed. São Paulo: Ática, 2016. Com base na figura e nos conhecimentos sobre germinação de sementes de plantas vasculares, assinale a alternativa correta.", "options": ["A reativação do metabolismo ocorre na etapa B, em que o embrião inicia a produção e liberação de hormônios e a produção de enzimas para o consumo das reservas.", "O consumo dos tecidos de reserva ocorre na etapa A, em que os produtos da respiração aeróbia atuam no alongamento das células e nas divisões mitóticas.", "A embebição da semente ocorre na etapa C, com a absorção da água, que amolece seu tegumento e faz aumentarem de volume semente e embrião.", "A pausa metabólica ocorre na etapa B, até que a semente encontre condições favoráveis à continuidade da germinação.", "O aumento da taxa de respiração celular ocorre na etapa A, com a produção de enzimas como amilases, lipases e proteases."], "subject": "Biologia", "answer": "A", "image": true}, {"id": 39, "stem": "Leia o texto a seguir. E o ato está para a potência como, por exemplo, quem constrói está para quem pode construir, quem está desperto para quem está dormindo, quem vê para quem está de olhos fechados, mas tem a visão, e o que é extraído da matéria para a matéria e o que é elaborado para o que não é elaborado. Ao primeiro membro dessas diferentes relações atribui-se a qualificação de ato e ao segundo a de potência. Aristóteles. Metafísica. Livro 9, 1048b. São Paulo: Loyola, 2002. Sobre os conceitos de ato e potência em Aristóteles, considere as afirmativas a seguir. I. Ato e potência explicam as mudanças e transformações dos fenômenos, sejam eles naturais ou não. II. As coisas existem em ato, que é a realização da sua essência, enquanto a potência é a capacidade que elas têm de se desenvolver e se transformar de acordo com seus fins. III. As transformações dos fenômenos são aparentes, pois ato e potência estão juntos ao mesmo tempo em todas as coisas. IV. Ato e potência é uma relação própria dos fenômenos do mundo sensível e ausente no mundo inteligível, onde tudo existe enquanto ato. Assinale a alternativa correta.", "options": ["Somente as afirmativas I e II são corretas.", "Somente as afirmativas I e IV são corretas.", "Somente as afirmativas III e IV são corretas.", "Somente as afirmativas I, II e III são corretas.", "Somente as afirmativas II, III e IV são corretas."], "subject": "Filosofia", "answer": "A", "image": false}, {"id": 40, "stem": "As regiões norte e noroeste do Estado do Paraná estão localizadas no Terceiro Planalto e apresentam formações geológicas do Grupo Bauru e do Grupo Serra Geral, que influenciam as características do solo e uso da terra. Com base nos conhecimentos sobre a Geografia e a História do Paraná, considere as afirmativas a seguir. I. A suscetibilidade dos solos à erosão na região noroeste do Paraná, associada ao desmatamento e ao seu uso inadequado, contribui para a formação de grandes voçorocas. II. Os solos da região noroeste, apesar de profundos, são arenosos e possuem baixos teores de matéria orgânica e capacidade reduzida de retenção de água. III. A região norte foi ocupada, no início do século XX, por uma empresa de capital britânico que investiu na cafeicultura, favorecida pelo latossolo roxo. IV. A região norte integra a porção meridional do Estado, com forte presença de imigrantes estrangeiros que se estabeleceram nos anos de 1930, impulsionados pela exploração das minas de xisto. Assinale a alternativa correta.", "options": ["Somente as afirmativas I e II são corretas.", "Somente as afirmativas I e IV são corretas.", "Somente as afirmativas III
